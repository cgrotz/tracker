<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget</title>
<meta name="description" content="Minimal offline calorie and weight tracker. All data stays in your browser.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app"></div>
<div id="overlay" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div id="sheetbody"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This tracker needs JavaScript.</p></noscript>
<script src="./app.js"></script>
</body>
</html>
